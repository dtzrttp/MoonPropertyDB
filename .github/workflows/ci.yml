name: MoonBit CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show Moon version
        run: moon version

      - name: Check native package
        run: moon check --target native

      - name: Build native package
        run: moon build --target native

      - name: Test native package
        run: moon test --target native

      - name: Check formatting
        run: moon fmt --check

      - name: Generate package interface
        run: moon info --target native
